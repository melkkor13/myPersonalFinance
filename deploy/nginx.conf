# The single origin the browser talks to.
#
# This container is the production equivalent of the Vite dev proxy (C15): it
# serves the built SPA and forwards /api to the api container, so the app stays
# same-origin. `apps/web/src/api/constants.ts` hard-codes `API_BASE_URL = ''` and
# the API registers no CORS plugin, so anything that splits these two onto
# different origins breaks the app rather than degrading it.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Needed because `proxy_pass` below goes through a
    # variable: that defers name resolution to request time instead of config
    # load time, so recreating the api container (new IP) does not leave nginx
    # holding a stale address until it is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 2m;

    # Cloudflare Access endpoints (`/cdn-cgi/access/*`, including the logout URL
    # the SPA navigates to) are terminated at the Cloudflare edge and never reach
    # this container. Without this block they would fall into the SPA fallback
    # below and answer 200 with index.html — so a logout performed against a
    # bypassed origin would *look* successful while leaving the session intact.
    location /cdn-cgi/ {
        return 404;
    }

    location /api/ {
        # With a variable in proxy_pass, nginx no longer appends the matched URI,
        # hence the explicit $request_uri.
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream$request_uri;

        proxy_http_version 1.1;
        # `Cf-Access-Jwt-Assertion` — the signed identity Cloudflare Access
        # injects — needs no `proxy_set_header`: nginx forwards client request
        # headers to the upstream by default. The `underscores_in_headers` trap
        # only drops names containing `_`, and this one is hyphenated. Adding an
        # explicit line here would be a no-op with a place to typo.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fastify is not configured with `trustProxy`, so it logs the proxy's
        # address rather than the client's. The headers above are set so that
        # enabling `trustProxy` later is a one-line API change with nothing to
        # do here.

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Vite content-hashes everything under /assets, so these are immutable.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback. @tanstack/react-router routes on the client, so a reload on
    # /me or /login must return index.html rather than 404. index.html itself is
    # never cached, or a deploy would keep serving the old asset references.
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
